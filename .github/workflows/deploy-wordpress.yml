name: Build and release WordPress plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish to WordPress.org
        required: true
        default: '1.0.9'
        type: string
      dry_run:
        description: Prepare SVN changes without committing them
        default: false
        type: boolean
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Verify version and syntax
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' georg-kloster-slavonic-translator.php)"
          stable="$(sed -n 's/^Stable tag: \(.*\)$/\1/p' readme.txt)"
          test "$TAG" = "$version"
          test "$TAG" = "$stable"
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/wp-cu-translator.js
          node --check scripts/build-translations.mjs
          node scripts/build-translations.mjs
          node tests/translations.mjs
          node tests/frontend.mjs
          git diff --exit-code -- languages

      - name: Build installation ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$RUNNER_TEMP/georg-kloster-slavonic-translator-package"
          mkdir -p "$package/georg-kloster-slavonic-translator"
          rsync -a --exclude-from=.distignore ./ "$package/georg-kloster-slavonic-translator/"
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/georg-kloster-slavonic-translator-$TAG.zip" georg-kloster-slavonic-translator)
          cp "georg-kloster-slavonic-translator-$TAG.zip" georg-kloster-slavonic-translator.zip
          find "$package/georg-kloster-slavonic-translator/languages" -type f \( -name '*.po' -o -name '*.mo' \) -delete
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/georg-kloster-slavonic-translator-wordpress-org-$TAG.zip" georg-kloster-slavonic-translator)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "georg-kloster-slavonic-translator-$TAG.zip" georg-kloster-slavonic-translator.zip "georg-kloster-slavonic-translator-wordpress-org-$TAG.zip" \
            --title "Georg-Kloster Slavonic Translator $TAG" \
            --generate-notes

  deploy-wordpress-org:
    if: ${{ always() && vars.WORDPRESS_ORG_ENABLED == 'true' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: wordpress-org-georg-kloster-slavonic-translator
      cancel-in-progress: false
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Verify release before SVN publication
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' georg-kloster-slavonic-translator.php)"
          stable="$(sed -n 's/^Stable tag: \(.*\)$/\1/p' readme.txt)"
          test "$VERSION" = "$version"
          test "$VERSION" = "$stable"
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/wp-cu-translator.js
          node scripts/build-translations.mjs
          node tests/translations.mjs
          node tests/frontend.mjs
          git diff --exit-code -- languages

      - name: Use WordPress.org language packs
        run: printf '\nlanguages/*.po\nlanguages/*.mo\n' >> .distignore

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: georg-kloster-slavonic-translator
